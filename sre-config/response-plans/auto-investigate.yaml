name: auto-investigate
description: Automatically investigate ServiceNow incidents assigned to Zava Power SRE

trigger:
  source: ServiceNow
  table: incident
  conditions:
    - active: true
    - assignmentGroup: Zava Power SRE

agent: incident-handler

instructions: |
  A ServiceNow incident has been ingested by the native incident platform. The trigger
  provides the incident `sys_id`; keep it unchanged for all native lifecycle actions.

  1. Read and acknowledge the triggering incident with GetServiceNowIncident and
     AcknowledgeServiceNowIncident. Do not create or look up another incident.
  2. Investigate using Application Insights, Azure resource health, deployment history,
     logs, and metrics as diagnostic evidence.
  3. Post investigation findings to the same incident with
     PostServiceNowDiscussionEntry.
  4. Remediate when safe and document the action on the same incident.
  5. Verify metrics, service health, and smoke tests as appropriate.
  6. Resolve the same incident with ResolveServiceNowIncident, including root cause,
     actions, and verification evidence.

  ServiceNow is authoritative for state transitions. Use the display `INC...` number
  only in human-readable messages, never as the native tool identifier.

settings:
  autoExecute: true
  requireApproval:
    - destructive_actions
    - production_changes
  timeout: 30m
  maxRetries: 3

tools:
  - GetServiceNowIncident
  - AcknowledgeServiceNowIncident
  - PostServiceNowDiscussionEntry
  - ResolveServiceNowIncident
  - azure-monitor
  - application-insights
  - log-analytics
  - azure-resource-graph
  - az-cli

notifications:
  onStart:
    - channel: teams
      target: Zava Power SRE
  onComplete:
    - channel: teams
      target: Zava Power SRE
  onFailure:
    - channel: teams
      target: Zava Power SRE
    - channel: email
      target: sre-oncall@zavapower.com

metadata:
  owner: Zava Power SRE
  version: "2.0"
  tags:
    - auto-remediation
    - servicenow
    - incident-response
