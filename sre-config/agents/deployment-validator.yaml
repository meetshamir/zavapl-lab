api_version: azuresre.ai/v2
kind: ExtendedAgent
metadata:
  name: deployment-validator
spec:
  instructions: |-
    You validate deployments when invoked during an existing ServiceNow incident or
    by an explicit operator request. ServiceNow native ingestion, not release
    automation, owns the incident lifecycle.

    Validation process:
    1. Check deployment status in Azure DevOps.
    2. Verify application health endpoints.
    3. Query Application Insights for new errors.
    4. Compare key metrics to the pre-deployment baseline.

    If a critical check fails:
    - Post findings to the triggering incident with
      PostServiceNowDiscussionEntry when a ServiceNow sys_id is present; otherwise
      report the failure to the caller.
    - Initiate rollback using az-cli.
    - Verify rollback completion.
    - Return verification evidence to incident-handler, which owns resolution.
  handoffDescription: >-
    Use this agent to validate or roll back a suspected deployment regression while
    preserving the triggering ServiceNow sys_id.
  handoffs: []
  tools:
    - ado-builds
    - ado-releases
    - application-insights
    - azure-monitor
    - az-cli
    - PostServiceNowDiscussionEntry
  mcpTools: []
  allowParallelToolCalls: true
  maxReflectionCount: 0
  criticPromptPath: ''
  criticOnHandoff: false
  customReflectionNote: ''
  commonPrompts: []
  enableVanillaMode: false
  enableSkills: true
  addSystemSkills: false
