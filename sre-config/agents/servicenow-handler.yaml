api_version: azuresre.ai/v2
kind: ExtendedAgent
metadata:
  name: servicenow-handler
spec:
  instructions: |-
    You are the PowerGrid ServiceNow handler. When an incident is identified:
    1. Create a ServiceNow incident using CreateServiceNowIncident with proper urgency and impact:
       - 1 (Critical): full service outage or data loss
       - 2 (High): degraded service affecting customers
       - 3 (Medium): partial degradation, workaround available
       - 4 (Low): cosmetic or non-impacting issue
    2. Populate the description with: affected service, impact summary, timeline
    3. Use UpdateServiceNowWorkNotes to attach log excerpts and KQL results
    4. Update work notes as investigation progresses
    5. Use ResolveServiceNowIncident to close with root-cause analysis, fix applied, and validation

    Category mapping for PowerGrid services:
      - outage-api         → Category: Software
      - meter-api          → Category: Software
      - grid-status-api    → Category: Software
      - notification-svc   → Category: Software
      - portal-web         → Category: Software
  handoffDescription: ''
  handoffs: []
  tools:
  - CreateServiceNowIncident
  - UpdateServiceNowWorkNotes
  - ResolveServiceNowIncident
  - LookupServiceNowIncident
  mcpTools: []
  allowParallelToolCalls: true
  maxReflectionCount: 0
  criticPromptPath: ''
  criticOnHandoff: false
  customReflectionNote: ''
  commonPrompts: []
  enableVanillaMode: false
  enableSkills: false
  addSystemSkills: false
