# ═══════════════════════════════════════════════════════════════
# Zava Power Limited — Build & Deploy Pipeline
# ═══════════════════════════════════════════════════════════════
# Builds container images and deploys to Azure Container Apps.
#
# Failure Scenarios (select via parameter):
#   none    — Normal healthy deployment (good code from src/)
#   crash   — Deploys outage-api with a real bug: NoneType crash
#             in the new SCADA enrichment code (bugs/crash/app.py)
#   perf    — Deploys grid-status-api with a real bug: synchronous
#             SHA-256 loop blocking Node event loop (bugs/perf/server.js)
#   config  — Deploys notification-svc with a real bug: wrong gateway
#             port (9443 instead of 8443) causing timeouts (bugs/config/main.go)
#   all     — Deploys all three buggy versions simultaneously
#
# Each bug is a realistic code change — not an env var toggle.
# SRE Agent can read the source code in ADO to find the root cause.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - src/*

pr: none

parameters:
  - name: failure_scenario
    displayName: 'Failure scenario to simulate'
    type: string
    default: 'none'
    values:
      - none
      - crash
      - perf
      - config
      - all
  - name: services
    displayName: 'Services to deploy (comma-separated, or "all")'
    type: string
    default: 'all'

variables:
  acrName: 'acrpowergrid'
  resourceGroup: 'rg-powergrid'
  workloadName: 'powergrid'

stages:
  # ── Build Stage ────────────────────────────────────────────
  - stage: Build
    displayName: 'Build Container Images'
    jobs:
      - job: BuildImages
        displayName: 'Build & Push to ACR'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Build outage-api'
            condition: or(contains('${{ parameters.services }}', 'all'), contains('${{ parameters.services }}', 'outage-api'))
            inputs:
              azureSubscription: 'zava-pl-azure'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                SCENARIO="${{ parameters.failure_scenario }}"

                # If crash scenario, swap in the buggy source before building
                if [ "$SCENARIO" = "crash" ] || [ "$SCENARIO" = "all" ]; then
                  echo "⚠️  Building outage-api with SCADA enrichment bug (bugs/crash/app.py)"
                  cp bugs/crash/app.py src/outage-api/app.py
                fi

                az acr build --registry $(acrName) \
                  --image outage-api:$(Build.BuildId) \
                  --image outage-api:latest \
                  --file src/outage-api/Dockerfile \
                  src/outage-api/ --no-logs

                # Restore clean source
                git checkout -- src/outage-api/app.py 2>/dev/null || true

          - task: AzureCLI@2
            displayName: 'Build meter-api'
            condition: or(contains('${{ parameters.services }}', 'all'), contains('${{ parameters.services }}', 'meter-api'))
            inputs:
              azureSubscription: 'zava-pl-azure'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Building meter-api..."
                az acr build --registry $(acrName) \
                  --image meter-api:$(Build.BuildId) \
                  --image meter-api:latest \
                  --file src/meter-api/Dockerfile \
                  src/meter-api/ --no-logs

          - task: AzureCLI@2
            displayName: 'Build grid-status-api'
            condition: or(contains('${{ parameters.services }}', 'all'), contains('${{ parameters.services }}', 'grid-status-api'))
            inputs:
              azureSubscription: 'zava-pl-azure'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                SCENARIO="${{ parameters.failure_scenario }}"

                # If perf scenario, swap in the buggy source before building
                if [ "$SCENARIO" = "perf" ] || [ "$SCENARIO" = "all" ]; then
                  echo "⚠️  Building grid-status-api with checksum loop bug (bugs/perf/server.js)"
                  cp bugs/perf/server.js src/grid-status-api/server.js
                fi

                az acr build --registry $(acrName) \
                  --image grid-status-api:$(Build.BuildId) \
                  --image grid-status-api:latest \
                  --file src/grid-status-api/Dockerfile \
                  src/grid-status-api/ --no-logs

                git checkout -- src/grid-status-api/server.js 2>/dev/null || true

          - task: AzureCLI@2
            displayName: 'Build notification-svc'
            condition: or(contains('${{ parameters.services }}', 'all'), contains('${{ parameters.services }}', 'notification-svc'))
            inputs:
              azureSubscription: 'zava-pl-azure'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                SCENARIO="${{ parameters.failure_scenario }}"

                # If config scenario, swap in the buggy source before building
                if [ "$SCENARIO" = "config" ] || [ "$SCENARIO" = "all" ]; then
                  echo "⚠️  Building notification-svc with wrong gateway port (bugs/config/main.go)"
                  cp bugs/config/main.go src/notification-svc/main.go
                fi

                az acr build --registry $(acrName) \
                  --image notification-svc:$(Build.BuildId) \
                  --image notification-svc:latest \
                  --file src/notification-svc/Dockerfile \
                  src/notification-svc/ --no-logs

                git checkout -- src/notification-svc/main.go 2>/dev/null || true

          - task: AzureCLI@2
            displayName: 'Build portal-web'
            condition: or(contains('${{ parameters.services }}', 'all'), contains('${{ parameters.services }}', 'portal-web'))
            inputs:
              azureSubscription: 'zava-pl-azure'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Building portal-web..."
                az acr build --registry $(acrName) \
                  --image portal-web:$(Build.BuildId) \
                  --image portal-web:latest \
                  --file src/portal-web/Dockerfile \
                  src/portal-web/ --no-logs

  # ── Deploy Stage ───────────────────────────────────────────
  - stage: Deploy
    displayName: 'Deploy to Container Apps'
    dependsOn: Build
    jobs:
      - deployment: DeployServices
        displayName: 'Deploy PowerGrid Services'
        pool:
          vmImage: 'ubuntu-latest'
        environment: 'production'
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: 'Deploy outage-api'
                  inputs:
                    azureSubscription: 'zava-pl-azure'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Deploying outage-api..."
                      az containerapp update \
                        -n ca-$(workloadName)-outage \
                        -g $(resourceGroup) \
                        --image $(acrName).azurecr.io/outage-api:$(Build.BuildId) \
                        --output none

                - task: AzureCLI@2
                  displayName: 'Deploy meter-api'
                  inputs:
                    azureSubscription: 'zava-pl-azure'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        -n ca-$(workloadName)-meter \
                        -g $(resourceGroup) \
                        --image $(acrName).azurecr.io/meter-api:$(Build.BuildId) \
                        --output none

                - task: AzureCLI@2
                  displayName: 'Deploy grid-status-api'
                  inputs:
                    azureSubscription: 'zava-pl-azure'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Deploying grid-status-api..."
                      az containerapp update \
                        -n ca-$(workloadName)-grid \
                        -g $(resourceGroup) \
                        --image $(acrName).azurecr.io/grid-status-api:$(Build.BuildId) \
                        --output none

                - task: AzureCLI@2
                  displayName: 'Deploy notification-svc'
                  inputs:
                    azureSubscription: 'zava-pl-azure'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      echo "Deploying notification-svc..."
                      az containerapp update \
                        -n ca-$(workloadName)-notify \
                        -g $(resourceGroup) \
                        --image $(acrName).azurecr.io/notification-svc:$(Build.BuildId) \
                        --set-env-vars REQUIRED_CONFIG=enabled \
                        --output none

                - task: AzureCLI@2
                  displayName: 'Deploy portal-web'
                  inputs:
                    azureSubscription: 'zava-pl-azure'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az containerapp update \
                        -n ca-$(workloadName)-portal \
                        -g $(resourceGroup) \
                        --image $(acrName).azurecr.io/portal-web:$(Build.BuildId) \
                        --output none

  # ── Validate Stage ─────────────────────────────────────────
  - stage: Validate
    displayName: 'Validate Deployment'
    dependsOn: Deploy
    jobs:
      - job: HealthChecks
        displayName: 'Run Health Checks'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: AzureCLI@2
            displayName: 'Verify service health'
            inputs:
              azureSubscription: 'zava-pl-azure'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Waiting 30s for revisions to activate..."
                sleep 30

                PORTAL_FQDN=$(az containerapp show -n ca-$(workloadName)-portal -g $(resourceGroup) --query properties.configuration.ingress.fqdn -o tsv)
                OUTAGE_FQDN=$(az containerapp show -n ca-$(workloadName)-outage -g $(resourceGroup) --query properties.configuration.ingress.fqdn -o tsv)
                METER_FQDN=$(az containerapp show -n ca-$(workloadName)-meter -g $(resourceGroup) --query properties.configuration.ingress.fqdn -o tsv)
                GRID_FQDN=$(az containerapp show -n ca-$(workloadName)-grid -g $(resourceGroup) --query properties.configuration.ingress.fqdn -o tsv)

                FAILED=0
                for svc in "portal:$PORTAL_FQDN" "outage:$OUTAGE_FQDN/health" "meter:$METER_FQDN/health" "grid:$GRID_FQDN/health"; do
                  NAME=$(echo $svc | cut -d: -f1)
                  URL="https://$(echo $svc | cut -d: -f2-)"
                  STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 10 || echo "000")
                  if [ "$STATUS" = "200" ]; then
                    echo "✅ $NAME: HTTP $STATUS"
                  else
                    echo "❌ $NAME: HTTP $STATUS"
                    FAILED=$((FAILED + 1))
                  fi
                done

                if [ $FAILED -gt 0 ]; then
                  echo ""
                  echo "##[warning]$FAILED service(s) failed health checks!"
                  echo "SRE Agent should detect this via Azure Monitor alerts."
                fi
