# Break Scenario: portal-web ImagePullBackOff
# Sets image to a nonexistent tag
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-web
  namespace: powergrid
spec:
  replicas: 1
  selector:
    matchLabels: { app: portal-web }
  template:
    metadata:
      labels: { app: portal-web }
    spec:
      containers:
        - name: portal-web
          image: "${ACR_NAME}.azurecr.io/portal-web:nonexistent-v99"
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
