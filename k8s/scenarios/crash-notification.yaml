# Break Scenario: notification-svc CrashLoopBackOff
# Removes REQUIRED_CONFIG env var, causing the Go service to exit(1) on startup
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-svc
  namespace: powergrid
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-svc }
  template:
    metadata:
      labels: { app: notification-svc }
    spec:
      containers:
        - name: notification-svc
          image: "${ACR_NAME}.azurecr.io/notification-svc:latest"
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: "100m", memory: "64Mi" }
            limits: { cpu: "250m", memory: "128Mi" }
          # REQUIRED_CONFIG intentionally omitted → crash on startup
